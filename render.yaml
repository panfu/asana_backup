services:
  - type: web
    name: asana-backup
    runtime: python
    plan: starter
    buildCommand: pip install uv && uv sync --frozen
    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: SECRET_KEY
        generateValue: true
      - key: ASANA_CLIENT_ID
        sync: false
      - key: ASANA_CLIENT_SECRET
        sync: false
      - key: ASANA_REDIRECT_URI
        sync: false
      - key: BASE_URL
        sync: false
      - key: DATA_DIR
        value: /var/data
      - key: ZIP_TTL_HOURS
        value: "3"
    disk:
      name: asana-backup-data
      mountPath: /var/data
      sizeGB: 5
